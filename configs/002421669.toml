# Multiface subject configuration
# Generated by scripts/prepare_multiface.py

[data]
cameras_json = "data/002421669/cameras.json"
image_dir = "data/002421669/images/%06d.png"
mask_dir = "data/002421669/hair_masks/%06d.png"
output_dir = "output/002421669"
downsample = 1.0
distorted_images = false

[mvs]
min_depth = 730
max_depth = 1350
num_hierarchy_levels = 4
gaussian_pyramid = false
num_neighbor_views = 25
min_angle = 1.0
max_angle = 90.0
num_view_select = 4
num_gpus = 1
alpha = 0.1
pt_sample_radius = 10.0
pt_sample_kappa = 41
use_mask = false
iterations = 8
patch_size = 21
delta_depth = 30.0
delta_orient = 0.8
spatial_prop_radius = 5.0

[mvs.gabor]
num_orientations = 180
kernel_size = 21
sigma = 1.12
gamma = 0.28
lambda = 3.00

[mvs.fusion]
position_threshold = 1.0
orientation_threshold = 10.0
min_neighbors = 4
cost_threshold = 0.2

[meanshift]
neighbor_radius = 2.0
min_neighbors = 10
sigma_position = 0.1
sigma_orientation = 30.0
convergence = 0.002
max_iterations = 1000

[trace]
step_size = 0.1
neighbor_radius = 0.1
angle_threshold = 30.0
min_strand_length = 2.0

[clean]
min_length = 5.0
outlier_radius = 10.0
outlier_min_neighbors = 3

[debug]
gpu_id = 0
log_level = "info"
log_file = ""
save_intermediates = false
profile = true
